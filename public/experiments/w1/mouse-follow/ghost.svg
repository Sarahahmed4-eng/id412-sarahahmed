<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160">
  <!-- Body: a round-topped sheet with a wavy hem -->
  <path
    d="M50 10 C24 10 14 32 14 60 L14 140 Q20 154 32 144 Q41 136 50 146 Q59 156 68 144 Q77 134 86 142 L86 60 C86 32 76 10 50 10 Z"
    fill="#f4f7fb"
    fill-opacity="0.92"
    stroke="#cdd7e3"
    stroke-width="1.5"
  />

  <!-- Cheeks -->
  <g fill="#f6a7b8" fill-opacity="0.7">
    <circle cx="33" cy="68" r="4.5" />
    <circle cx="67" cy="68" r="4.5" />
  </g>

  <!-- Eyes and a small round mouth -->
  <g fill="#1e2a3a">
    <ellipse cx="40" cy="56" rx="4.5" ry="6" />
    <ellipse cx="60" cy="56" rx="4.5" ry="6" />
    <ellipse cx="50" cy="72" rx="3" ry="4" />
  </g>
</svg>
